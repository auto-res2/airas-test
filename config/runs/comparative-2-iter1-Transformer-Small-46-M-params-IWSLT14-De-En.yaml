run_id: comparative-2-iter1-Transformer-Small-46-M-params-IWSLT14-De-En
method: comparative-2
model:
  name: transformer_small
  param_count: 46000000
  num_layers: 6
  d_model: 512
  num_heads: 8
  d_ff: 2048
  dropout: 0.1
dataset:
  name: iwslt14_de_en
  source_language: de
  target_language: en
  bpe_vocab_size: 10000
  max_seq_length: 256
  max_tokens_per_batch: 4096
training:
  max_updates: 50000
  optimizer: adamw
  initial_learning_rate: 0.0007
  betas: [0.9, 0.999]
  weight_decay: 0.0001
  scheduler:
    name: inverse_sqrt
    warmup_updates: 4000
  seeds: [42, 43, 44]
logging:
  peak_memory: true
  log_interval: 100
optuna:
  n_trials: 20
  search_space:
    learning_rate:
      type: loguniform
      low: 0.0001
      high: 0.01
    beta1:
      type: uniform
      low: 0.8
      high: 0.95
    beta2:
      type: uniform
      low: 0.98
      high: 0.9999
    weight_decay:
      type: loguniform
      low: 1e-06
      high: 0.001
